[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gauge"
version = "0.2.0"
description = "Gauge: discover early-stage New Jersey startups from public records."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# LLM-assisted match review and announcement extraction (issues #16, #17).
ai = ["anthropic>=1.8"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["gauge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
