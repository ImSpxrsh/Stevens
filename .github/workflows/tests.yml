name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,ai,api]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest
      - name: Golden path
        run: python -m gauge.golden

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
